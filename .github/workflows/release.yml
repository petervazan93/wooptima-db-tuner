name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck python3
      - name: Static and unit tests
        run: make check && make test

  integration:
    runs-on: ubuntu-24.04
    env:
      DBTUNE_REQUIRE_INTEGRATION: 1
      DBTUNE_UI_LANG: en
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: MariaDB lifecycle integration
        run: make integration

  publish:
    needs: [quality, integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build release artifact
        run: make build
      - name: Verify tag matches artifact version
        run: test "v$(dist/dbtune version | awk '{print $2}')" = "$GITHUB_REF_NAME"
      - name: Verify production runtime boundary
        run: |
          test "$(grep -c '^readonly DBTUNE_ARTIFACT_PROFILE=production$' dist/dbtune)" -eq 1
          ! grep -q 'DBTUNE_ARTIFACT_PROFILE=source-test\|DBTUNE_ARTIFACT_PROFILE=integration-test' dist/dbtune
          test -x dist/dbtune
          (cd dist && sha256sum -c dbtune.sha256)
          test ! -e dist/dbtune-integration
          marker=$(mktemp)
          rm -f "$marker"
          marker_command=$(mktemp)
          printf '%s\n' '#!/usr/bin/env bash' 'touch "$DBTUNE_OVERRIDE_MARKER"' >"$marker_command"
          chmod +x "$marker_command"
          env DBTUNE_FLOCK="$marker_command" DBTUNE_SYSTEMCTL="$marker_command" \
            DBTUNE_SQL_AUTH_METHOD=defaults DBTUNE_SQL_DEFAULTS_FILE=/tmp/attacker.cnf \
            DBTUNE_PUBLISH_FAULT_HOOK="$marker_command" DBTUNE_NOW_EPOCH=1 \
            DBTUNE_MIN_APPLY_SAMPLES=0 DBTUNE_OVERRIDE_MARKER="$marker" \
            dist/dbtune status
          test ! -e "$marker"
          test "$(grep -c '^readonly DBTUNE_ARTIFACT_PROFILE=production$' dist/dbtune)" -eq 1
          ! grep -q 'DBTUNE_ARTIFACT_PROFILE=source-test\|DBTUNE_ARTIFACT_PROFILE=integration-test' dist/dbtune
          test -x dist/dbtune
          (cd dist && sha256sum -c dbtune.sha256)
          test ! -e dist/dbtune-integration
      - name: Attest release artifacts
        id: attest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/dbtune
            dist/dbtune.sha256
            install.sh
      - name: Stage offline attestation bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" dist/dbtune-attestation.jsonl
      - name: Verify dbtune attestation policy
        run: gh attestation verify dist/dbtune --bundle dist/dbtune-attestation.jsonl --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "$GITHUB_REF" --deny-self-hosted-runners
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/dbtune dist/dbtune.sha256 dist/dbtune-attestation.jsonl install.sh --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
